name: Sleazeburg 64 tests

on:
  pull_request:
    paths: ['gta-c64/**', '.github/workflows/sleazeburg-tests.yml']
  push:
    branches: [main]
    paths: ['gta-c64/**', '.github/workflows/sleazeburg-tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gta-c64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gta-c64/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:e2e
