[package]
name = "sleazeburg-64"
version = "0.1.0"
description = "Sleazeburg 64 as a desktop app, with Discord Rich Presence built in"
license = "GPL-2.0-or-later"
repository = "https://github.com/mselin/mselin.github.io"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "sleazeburg_64_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO"] }

# For the tests that serve a named pipe of their own, to check what its server can do.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
